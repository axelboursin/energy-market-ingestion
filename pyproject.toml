[project]
name = "energy-market-ingestion"
version = "0.1.0"
description = "Serverless ingestion of European day-ahead electricity prices into an S3/Athena data lake"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyarrow>=21",
]

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[s3]>=5",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
